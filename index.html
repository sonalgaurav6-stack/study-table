<html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Room</title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            body {
                background-color: rgb(47, 47, 47);
                width: 100vw;
                height: 100vh;
                display: grid;
                place-content: center;
            }
            div{
                background-color: green;
                width: 350px;
                text-align: center;
                border-radius: 20px;
            }
            img{
                width: 100%;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
            }
            button {
                width: 80%;
                height: 40px;
                font-size: 20px;
                margin: 5px;
                border-radius: 5px;
            }
        </style>
    </head>

    <body>
        <div>
            <img src="sonal-photo.jpg" alt="sonal ka photo" id="bulb">
            <button onclick="change()" id="btn">Turn On</button>
        </div>


        <script>
            let bulb = document.getElementById('bulb');
            let btn = document.getElementById('btn');
            let light = false;

            function change(){
                if(light==false) {
                    bulb.style.display = "block";
                   btn.innerHTML = "Turn Off";
                   light = true;
                    
                }
                else {
                  bulb.style.display = "none";
                  btn.innerHTML = "Turn On";
                  light = false;  
                }

            }
        </script>
    </body>

</html>
